# src/main/resources/application-dev.yml — read only when the dev profile is active
server:
  port: 8081
app:
  mail:
    enabled: false          # no mail is sent in development
    retry-count: 1
  pagination:
    default-size: 5         # small pages are handy when testing
    max-size: 50
logging:
  level:
    kz.iitu: DEBUG
